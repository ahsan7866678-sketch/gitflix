kind = "web"
previewPath = "/"
title = "Filxjoy — Movie Discovery Hub"
version = "1.0.0"
id = "artifacts/movie-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22134

[services.development]
run = "pnpm --filter @workspace/movie-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/movie-app", "run", "build" ]
publicDir = "artifacts/movie-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22134"
BASE_PATH = "/"
